# Audit-only HAProxy coarse-admission example. Not wired into production.
frontend public_http
    bind :8080
    mode http
    stick-table type ip size 100k expire 10m store http_req_rate(1m)
    http-request track-sc0 src
    http-request set-header X-Ores-Rate-Limit-Mode audit
    http-request set-header X-Ores-Rate-Limit-Observed-Rate %[sc_http_req_rate(0)]
    default_backend application

backend application
    mode http
    server app application:8080 check
