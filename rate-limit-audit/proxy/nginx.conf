# Audit-only NGINX ingress example. This file is not wired into production.
# Native shared memory is node-local; it is not an atomic global quota.
limit_req_zone $binary_remote_addr zone=ores_edge_audit:10m rate=100r/m;

server {
    listen 8080;
    limit_req_dry_run on;

    location / {
        limit_req zone=ores_edge_audit burst=50 nodelay;
        proxy_set_header X-Ores-Rate-Limit-Mode audit;
        proxy_set_header X-Ores-Rate-Limit-Dry-Run $limit_req_status;
        proxy_pass http://application_upstream;
    }
}
