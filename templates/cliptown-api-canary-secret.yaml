apiVersion: external-secrets.io/v1
kind: ExternalSecret
metadata:
  name: cliptown-api-runtime
  namespace: cliptown-canary
spec:
  refreshInterval: 15m
  secretStoreRef:
    kind: ClusterSecretStore
    name: dd-cluster-secrets
  target:
    name: cliptown-api-runtime
    creationPolicy: Owner
  data:
    - secretKey: database-url
      remoteRef:
        key: dd/cliptown/canary/database-url
    - secretKey: shared-auth-introspect-secret
      remoteRef:
        key: dd/shared-auth/introspect-secret
