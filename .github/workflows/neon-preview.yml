name: neon-preview

on:
  pull_request:
    types: [opened, reopened, synchronize, closed]
    paths: ["neon/**", ".db-providers.json", ".github/workflows/neon-preview.yml"]

permissions:
  contents: read

concurrency:
  group: neon-preview-${{ github.event.pull_request.number }}
  cancel-in-progress: false

jobs:
  branch:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          persist-credentials: false
      - if: github.event.action != 'closed'
        uses: neondatabase/create-branch-action@34f619c41c6e67b4f2f13f1c6eae90827a5f2cf4 # v5
        with:
          project_id: ${{ vars.NEON_PROJECT_ID }}
          branch_name: preview/pr-${{ github.event.number }}-${{ github.head_ref }}
          api_key: ${{ secrets.NEON_API_KEY }}
      - if: github.event.action == 'closed'
        uses: neondatabase/delete-branch-action@4468d825d5a88ef4012f1705a82f02ec3072f776 # v3
        with:
          project_id: ${{ vars.NEON_PROJECT_ID }}
          branch: preview/pr-${{ github.event.number }}-${{ github.head_ref }}
          api_key: ${{ secrets.NEON_API_KEY }}
