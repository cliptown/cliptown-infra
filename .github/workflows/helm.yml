name: GitOps CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

permissions:
  contents: read

jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Set up Helm
        uses: azure/setup-helm@v4
        with:
          version: v3.17.3
      - name: Lint and render chart
        run: |
          helm lint . --strict
          helm template cliptown-apps . > /tmp/cliptown-rendered.yaml
      - name: Validate root Argo application
        run: |
          test -s argocd/cliptown-monorepo.yaml
          grep -Fq 'targetRevision: main' argocd/cliptown-monorepo.yaml
          grep -Fq 'path: .' argocd/cliptown-monorepo.yaml
          grep -Fq 'releaseName: cliptown-apps' argocd/cliptown-monorepo.yaml
      - name: Reject floating live revisions and missing live sources
        run: |
          if grep -RInE 'targetRevision:[[:space:]]*(HEAD|master|dev|latest)' argocd templates 2>/dev/null; then
            echo 'live GitOps applications must use reviewed immutable branch or release references' >&2
            exit 1
          fi
          if grep -RIn 'path: k8s' templates 2>/dev/null; then
            echo 'backend k8s path is not published on main yet' >&2
            exit 1
          fi
      - name: Check repository hygiene
        run: |
          bad=$(git ls-files | grep -E '(^|/)(\.env|secrets?\.ya?ml|values\.prod\.ya?ml)$' || true)
          test -z "$bad" || { printf 'forbidden tracked secret-shaped files:\n%s\n' "$bad"; exit 1; }
