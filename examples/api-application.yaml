# This manifest is intentionally not rendered by the Helm chart yet.
# Move it into templates/ only after cliptown-rust-backend.rs publishes a
# validated Kubernetes path on main and the image/release contract is pinned.
apiVersion: argoproj.io/v1alpha1
kind: Application
metadata:
  name: cliptown-api
  namespace: argocd
spec:
  project: default
  source:
    repoURL: https://github.com/cliptown/cliptown-rust-backend.rs.git
    targetRevision: main
    path: k8s
  destination:
    server: https://kubernetes.default.svc
    namespace: cliptown
  syncPolicy:
    syncOptions:
      - CreateNamespace=true
