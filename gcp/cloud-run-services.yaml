schemaVersion: ores.gcp-cloud-run.org.v1
organization: cliptown
infraRepository: cliptown/cliptown-infra
canonicalDeploymentRepository: ORESoftware/k8s-cluster
centralModulePath: gcp/cloud-run-rust-service
gcp:
  projectId: null
  region: us-central1
  state: planned
services:
  - role: web-server
    repository: cliptown/cliptown-web-server.rs
    serviceName: cliptown-web-server
    repositoryState: present
  - role: admin-web-server
    repository: cliptown/cliptown-admin-web-server.rs
    serviceName: cliptown-admin-web-server
    repositoryState: present
  - role: api-server
    repository: cliptown/cliptown-api-server.rs
    serviceName: cliptown-api-server
    repositoryState: present
  - role: admin-api-server
    repository: cliptown/cliptown-admin-api-server.rs
    serviceName: cliptown-admin-api-server
    repositoryState: present
probes:
  startup:
    path: /readyz
    failureStatus: 503
  liveness:
    path: /healthz
    dependencyFree: true
  readiness:
    path: /readyz
    failureStatus: 503
  buildIdentity:
    path: /version
    cacheControl: no-store
  metrics:
    path: /metrics
    exposure: private
runtime:
  minInstances: 0
  maxInstances: 3
  imagePolicy: digest-only
  serviceAccountPolicy: per-service
kubernetes:
  startupPath: /healthz
  livenessPath: /healthz
  readinessPath: /readyz
neon:
  organization: cliptown
  project: canonical
  database: neondb
  state: project-created
